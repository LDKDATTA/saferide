{% load static %}
<!DOCTYPE html>
<html>
<head>
    <title>Emergency Alert - SafeRide+</title>
    <link rel="stylesheet" href="{% static 'css/style.css' %}">
</head>
<body>

<!-- HERO -->
<div class="hero">
    <h1>🚨 Emergency Alert</h1>
    <p>Send your location instantly for help</p>
</div>

<!-- NAVBAR -->
<div class="navbar">
    <a href="/">Home</a>
    <a href="/share_location/">Book Ride</a>
    <a href="/login/">Logout</a>
</div>

<!-- ALERT FORM -->
<div class="container">
    <div class="card">

        <h2 style="color:red;">⚠️ Panic Mode</h2>

        <form action="/PanicAction" method="post">
            {% csrf_token %}

            <input type="text" name="location" placeholder="Enter your current location" required>

            <button style="background: red;">🚨 Send Emergency Alert</button>

        </form>

        <!-- MESSAGE -->
        {% if data %}
            <p style="text-align:center; margin-top:10px; color:green;">
                {{ data }}
            </p>
        {% endif %}

    </div>
</div>

</body>
</html>
