{% load static %}
<!DOCTYPE html>
<html>
<head>
    <title>Driver Location - SafeRide+</title>
    <link rel="stylesheet" href="{% static 'css/style.css' %}">
</head>
<body>

<!-- HERO -->
<div class="hero">
    <h1>📍 Update Location</h1>
    <p>Enter your current location details</p>
</div>

<!-- NAVBAR -->
<div class="navbar">
    <a href="/">Home</a>
    <a href="/driver_requests/">Ride Requests</a>
    <a href="/login/">Logout</a>
</div>

<!-- FORM -->
<div class="container">
    <div class="card">

        <form action="/DriverLocationAction" method="post">
            {% csrf_token %}

            <input type="text" name="location" placeholder="Enter Location Name" required>

            <input type="text" name="lat" placeholder="Enter Latitude" required>

            <input type="text" name="lon" placeholder="Enter Longitude" required>

            <button type="submit">Submit Location</button>

        </form>

        {% if data %}
            <p style="text-align:center; margin-top:10px; color:green;">
                {{ data }}
            </p>
        {% endif %}

    </div>
</div>

</body>
</html>
