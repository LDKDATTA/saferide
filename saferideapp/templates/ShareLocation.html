{% load static %}
<!DOCTYPE html>
<html>
<head>
    <title>Book Ride - SafeRide+</title>
    <link rel="stylesheet" href="{% static 'css/style.css' %}">
</head>
<body>

<!-- HERO -->
<div class="hero">
    <h1>🚗 Book Ride</h1>
    <p>Enter your location to find nearby drivers</p>
</div>

<!-- NAVBAR -->
<div class="navbar">
    <a href="/">Home</a>
    <a href="/past_rides/">Past Rides</a>
    <a href="/panic/">Emergency</a>
    <a href="/login/">Logout</a>
</div>

<!-- FORM -->
<div class="container">
    <div class="card">

        <form action="/ShareLocationAction" method="post">
            {% csrf_token %}

            <!-- ✅ NEW FIELD -->
            <input type="text" name="destination" placeholder="Enter Destination Name" required>

            <input type="text" name="lat" placeholder="Enter Latitude" required>
            <input type="text" name="lon" placeholder="Enter Longitude" required>

            <button type="submit">Find Nearby Drivers</button>

        </form>

        {% if data %}
            <p style="text-align:center; margin-top:10px; color:green;">
                {{ data }}
            </p>
        {% endif %}

    </div>
</div>

</body>
</html>
