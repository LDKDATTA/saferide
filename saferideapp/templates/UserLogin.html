{% load static %}
<!DOCTYPE html>
<html>
<head>
    <title>Login - SafeRide+</title>
    <link rel="stylesheet" href="{% static 'css/style.css' %}">
</head>
<body>

<!-- HERO -->
<div class="hero">
    <h1>🔐 Login</h1>
    <p>Access your SafeRide account</p>
</div>

<!-- NAVBAR -->
<div class="navbar">
    <a href="/">Home</a>
    <a href="/signup/">Signup</a>
</div>

<!-- FORM -->
<div class="container">
    <div class="card">

        <form action="/LoginAction" method="post">
            {% csrf_token %}

            <input type="text" name="t1" placeholder="Username" required>
            <input type="password" name="t2" placeholder="Password" required>

            <!-- TWO BUTTONS SIDE BY SIDE -->
            <div class="button-row">
                <button type="submit" name="login_type" value="user">
                    Passenger
                </button>

                <button type="submit" name="login_type" value="driver">
                    Driver
                </button>
            </div>

        </form>

        <!-- MESSAGE -->
        {% if data %}
            <p style="text-align:center; margin-top:10px; color:red;">
                {{ data }}
            </p>
        {% endif %}

    </div>
</div>

</body>
</html>
